name: Source sanity

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  source-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: |
          python -m compileall -q code

      - name: Reject generated/build artifacts
        shell: bash
        run: |
          set -euo pipefail
          bad="$(find . -type f \( -name '*.pyc' -o -name '*.o' -o -name '*.obj' -o -name '*.exe' \) -print)"
          bad_dirs="$(find . -type d \( -name '__pycache__' -o -name '.pio' -o -name build -o -name install -o -name log \) -print)"
          if [[ -n "$bad$bad_dirs" ]]; then
            printf 'Generated artifacts must not be committed:\n%s\n%s\n' "$bad" "$bad_dirs"
            exit 1
          fi

      - name: Check expected thesis entry points
        shell: bash
        run: |
          set -euo pipefail
          test -f code/firmware/pico/src/main.cpp
          test -f code/firmware/pico/src/Neuro_PID.cpp
          test -f code/ros2/pico_serial_bridge/pico_serial_bridge/serial_bridge_node.py
          test -f code/ros2/pico_serial_bridge/pico_serial_bridge/differential_odometry_node.py
          test -f code/ros2/pico_serial_bridge/pico_serial_bridge/lidar_scan_node.py
          test -f code/ros2/pi_camera_publisher/src/pi_camera_publisher_node.cpp
          test -f code/ros2/gpu_vision_inference/src/gpu_vision_inference_node.cpp
          test -f code/experiments/run_all.py
