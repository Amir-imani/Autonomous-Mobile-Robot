name: Assemble STM8 board files
on:
  push:
    paths:
      - ".upload_parts/stm8/**"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and verify source files
        shell: python
        run: |
          import base64, gzip, hashlib, json
          from pathlib import Path
          root = Path(".upload_parts/stm8")
          manifest = json.loads((root / "manifest.json").read_text())
          for item in manifest["files"]:
              encoded = "".join((root / p).read_text(encoding="ascii").strip() for p in item["parts"])
              payload = base64.b64decode(encoded)
              if item.get("gzip"):
                  payload = gzip.decompress(payload)
              assert hashlib.sha256(payload).hexdigest() == item["sha256"], item["target"]
              assert len(payload) == item["size"], item["target"]
              target = Path(item["target"])
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(payload)
              print(f"Verified {target}: {len(payload)} bytes")
      - name: Remove upload staging
        run: rm -rf .upload_parts/stm8
      - name: Commit assembled files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Add STM8 fan controller source, images and schematic" && git push)
