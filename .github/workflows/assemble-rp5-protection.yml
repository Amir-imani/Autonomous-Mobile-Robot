name: Assemble staged RP5 hardware files

on:
  push:
    paths:
      - ".upload_parts/rp5_protection/**"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble hardware files
        shell: python
        run: |
          import base64
          import hashlib
          import json
          from pathlib import Path

          root = Path(".upload_parts/rp5_protection")
          manifest_path = root / "manifest.json"
          if not manifest_path.exists():
              print("No manifest present; payload already assembled.")
              raise SystemExit(0)

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          for item in manifest["files"]:
              encoded = "".join(
                  (root / part).read_text(encoding="ascii").strip()
                  for part in item["parts"]
              )
              payload = base64.b64decode(encoded)
              digest = hashlib.sha256(payload).hexdigest()
              if digest != item["sha256"]:
                  raise RuntimeError(f"SHA-256 mismatch for {item['target']}")
              if len(payload) != item["size"]:
                  raise RuntimeError(f"Size mismatch for {item['target']}")
              target = Path(item["target"])
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(payload)
              print(f"Assembled {target} ({len(payload)} bytes)")

      - name: Remove staging payload
        shell: bash
        run: rm -rf .upload_parts/rp5_protection

      - name: Commit assembled files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Assemble Raspberry Pi 5 protection board artifacts"
          git push
