name: Assemble staged hardware files

on:
  push:
    paths:
      - ".upload_parts/pico_carrier/**"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble binary and large hardware files
        shell: python
        run: |
          import base64
          import gzip
          import hashlib
          import json
          from pathlib import Path

          root = Path(".upload_parts/pico_carrier")
          manifest_path = root / "manifest.json"
          if not manifest_path.exists():
              print("No manifest present; staged payload was already assembled.")
              raise SystemExit(0)

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          for item in manifest["files"]:
              encoded = "".join(
                  (root / part).read_text(encoding="ascii").strip()
                  for part in item["parts"]
              )
              payload = base64.b64decode(encoded)
              if item.get("gzip", False):
                  payload = gzip.decompress(payload)

              digest = hashlib.sha256(payload).hexdigest()
              if digest != item["sha256"]:
                  raise RuntimeError(
                      f"SHA-256 mismatch for {item['target']}: {digest}"
                  )
              if len(payload) != item["size"]:
                  raise RuntimeError(
                      f"Size mismatch for {item['target']}: {len(payload)}"
                  )

              target = Path(item["target"])
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(payload)
              print(f"Assembled {target} ({len(payload)} bytes)")

      - name: Remove staging payload
        shell: bash
        run: |
          if [[ -f .upload_parts/pico_carrier/manifest.json ]]; then
            rm -rf .upload_parts/pico_carrier
          fi

      - name: Commit assembled hardware files
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet && [[ -z "$(git status --porcelain)" ]]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Assemble Pico carrier hardware artifacts"
          git push
